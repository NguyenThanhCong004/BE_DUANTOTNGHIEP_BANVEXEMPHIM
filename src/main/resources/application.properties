# Cổng API (FE mặc định: VITE_API_BASE_URL=http://localhost:8080)
server.port=8080
# server.address=0.0.0.0

# --- UTF-8 / tiếng Việt (request/response JSON & form) ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
spring.application.name=Java6

# --- Seed Docker/dev: chỉ tạo dữ liệu nền tối thiểu và 1 tài khoản admin nếu chưa có ---
app.data.seed=${APP_DATA_SEED:false}
app.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@fpoly.local}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.admin.fullname=${SEED_ADMIN_FULLNAME:System Admin}
app.seed.admin.phone=${SEED_ADMIN_PHONE:0901111111}

# sendStringParametersAsUnicode: gửi chuỗi Unicode (N'...') — cần cho tiếng Việt trên SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=JAVA6;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# String JPA -> NVARCHAR trên SQL Server (tiếng Việt có dấu)
spring.jpa.properties.hibernate.use_nationalized_character_data=true

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:7200000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:864000000}
# --- CẤU HÌNH PAYOS CHO THANH TOÁN ---
payos.base-url=${PAYOS_BASE_URL:https://api-merchant.payos.vn}
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# --- CẤU HÌNH GỬI EMAIL (Gmail SMTP) ---
# Khuyến nghị production: spring.mail.password=${MAIL_PASSWORD} (không commit mật khẩu ứng dụng).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# --- Quên mật khẩu (khách): OTP qua email + resetSessionToken trên FE (3 bước) ---
# Token trong DB cũ (chỉ liên kết email, không OTP): vẫn reset được bằng POST /reset-password
app.password-reset.otp-validity-minutes=10
app.password-reset.password-step-validity-minutes=15
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.password-reset.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.password-reset.frontend-reset-path=/reset-password
app.password-reset.token-validity-minutes=60

# --- POS ticket export ---
app.ticket-export-dir=${TICKET_EXPORT_DIR:TICKETS_EXPORT}

# --- Swagger / OpenAPI (springdoc) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.fpoly.duan.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.syntaxHighlight.theme=agate
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.customCssUrl=/swagger-ui/custom.css
springdoc.show-actuator=false
springdoc.writer-with-default-pretty-printer=true
